{% extends "base.html" %}

{% block title %}Enter Command Code | War Command Interface{% endblock %}

{% block content %}
<div id="code-entry" class="centered">
  <h1>ACCESS AUTHORIZATION REQUIRED</h1>
  <p>Enter your assigned <span class="highlight">PLAYER CODE</span> to proceed.</p>

  <form action="/enter_code" method="POST" id="code-form">
    <input type="text" name="playercode" maxlength="32" placeholder="Enter Code..." required autocomplete="off">
    <button type="submit">ACCESS COMMAND</button>
  </form>

  <div id="code-hint">⚠ Unauthorized access is monitored.</div>
</div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("code-form");
    const input = form.querySelector("input[name='playercode']");

    const savedCode = localStorage.getItem("savedPlayerCode");
    if (savedCode) {
      input.value = savedCode;
      form.submit();
      return;
    }

    const remember = document.createElement("label");
    remember.innerHTML = `
      <input type="checkbox" id="remember-code"> Remember this code
    `;
    form.appendChild(remember);

    form.addEventListener("submit", () => {
      const code = input.value.trim();
      if (document.getElementById("remember-code").checked && code) {
        localStorage.setItem("savedPlayerCode", code);
      }
    });
  });
</script>
{% endblock %}
