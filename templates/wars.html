{% extends "base.html" %}
{% block title %}Ongoing Wars | War Command{% endblock %}

{% block head %}
  {{ super() }}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/wars.css') }}">
  <style>
    #search-bar {
      width: 60%;
      max-width: 400px;
      margin: 15px auto;
      display: block;
      padding: 8px 12px;
      border: 1px solid #555;
      border-radius: 6px;
      background-color: #111;
      color: #eee;
      font-size: 1rem;
      transition: 0.2s border;
    }
    #search-bar:focus {
      border-color: #ff4444;
      outline: none;
    }
    .no-results {
      text-align: center;
      color: #aaa;
      margin-top: 20px;
    }
  </style>
{% endblock %}

{% block content %}
  <h1>Ongoing Wars</h1>

  <!-- Search bar -->
  <input
    type="text"
    id="search-bar"
    placeholder="Search by war name, nations, or description..."
    autocomplete="off">

  <div id="wars-list" class="wars-grid"></div>
  <button onclick="window.location.href='/'" class="back-btn">Return to Command</button>
{% endblock %}

{% block scripts %}
<script>
let allWars = [];

function renderWars(list) {
  const container = document.getElementById("wars-list");
  container.innerHTML = "";

  if (!list.length) {
    container.innerHTML = `<p class="no-results">No wars match your search.</p>`;
    return;
  }

  list.forEach(war => {
    const card = document.createElement("div");
    card.classList.add("war-card");
    card.innerHTML = `
      <h2>${war.Name || "Unnamed Conflict"}</h2>
      <p>${war.Desc || "No description available."}</p>
      ${
        war.Sides
          ? `<ul>${war.Sides.map(
              s =>
                `<li><b>${s.Name}</b> — ${s.Nations}${
                  s.Backers ? ` <i>(${s.Backers})</i>` : ""
                }</li>`
            ).join("")}</ul>`
          : ""
      }
    `;
    container.appendChild(card);
  });
}

fetch("/api/wars")
  .then(res => res.json())
  .then(data => {
    allWars = data.wars || [];
    renderWars(allWars);
  })
  .catch(err => {
    document.getElementById("wars-list").innerHTML = `<p>Error loading wars: ${err}</p>`;
  });

document.getElementById("search-bar").addEventListener("input", e => {
  const term = e.target.value.toLowerCase();

  const filtered = allWars.filter(war => {
    if (!war) return false;

    const name = war.Name?.toLowerCase().includes(term);
    const desc = war.Desc?.toLowerCase().includes(term);
    const sideMatch = war.Sides?.some(s =>
      [s.Name, s.Nations, s.Backers]
        .filter(Boolean)
        .some(v => v.toLowerCase().includes(term))
    );

    return name || desc || sideMatch;
  });

  renderWars(filtered);
});
</script>
{% endblock %}
