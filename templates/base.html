<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}War Command{% endblock %}</title>

  <!-- 🔹 Shared UI elements (volume, settings, overlays) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ui_shared.css') }}">

  <!-- 🔹 Intro only — disabled on dashboard -->
  {% if 'dashboard' not in request.path %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/intro.css') }}">
  {% endif %}

  <!-- 🔹 Page-specific CSS -->
  {% block head %}{% endblock %}
</head>

<body>

  <div id="peasant-toggle">
    <label>
      <input type="checkbox" id="peasantModeToggle">
      ☕ Enable Peasant Mode
    </label>
  </div>

  <style>
    #peasant-toggle {
      position: fixed;
      top: 8px;
      right: 12px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      z-index: 9999;
    }
    #peasant-toggle input { transform: scale(1.1); margin-right: 4px; }
  </style>

  <style>
    body.peasant-active #loading-bg {
      background: #000 !important;
      background-image: none !important;
    }
    body.peasant-active img.loading-logo {
      filter: grayscale(100%) brightness(0.8);
    }
  </style>



  <!-- GLOBAL AUDIO & ICONS (shared across all pages) -->
  {% include '_audio_ui.html' %}
  <audio id="load-complete" src="{{ url_for('static', filename='audio/load_complete.mp3') }}"></audio>
  <audio id="settings-click" src="{{ url_for('static', filename='audio/settings_click.mp3') }}" preload="auto"></audio>

  <!-- PAGE-SPECIFIC CONTENT -->
  {% block content %}{% endblock %}

  <!-- ICON PATHS for JS -->
  <script>
    window.iconMute = "{{ url_for('static', filename='icons/mute.svg') }}";
    window.iconUnmute = "{{ url_for('static', filename='icons/unmute.svg') }}";
  </script>

  <!-- PEASANT MODE -->
  <script src="{{ url_for('static', filename='js/peasantMode.js') }}"></script>
  <!-- GLOBAL AUDIO CONTROLLER -->
  <script src="{{ url_for('static', filename='js/audioController.js') }}"></script>

  <!-- PAGE-SPECIFIC JS -->
  {% block scripts %}{% endblock %}
</body>
</html>
